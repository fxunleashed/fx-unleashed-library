name: Submit a dash or screensaver
description: "Share yours with everyone. No Git needed: attach the package the plugin made."
title: "Submit: "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        **In the plugin:** Dashes tab, pick your dash, **Package for the library**. It writes `<id>.fxdash.zip`:
        attach that file to the box below (drag it in, or click "selecting them" under the box and pick it), tick the three
        boxes and submit.

        A bot checks the package (format, size, no scripts, preview, checksum). If it passes, it is published straight away
        and this issue closes with the link; if not, the bot says what to fix and checks again when you edit this issue.
        You are credited as the author, and you can update your dash later the same way: submit again with a higher
        **Version** (only you can change it).
  - type: input
    id: name
    attributes:
      label: Name
      description: What the dash or screensaver is called.
    validations:
      required: true
  - type: textarea
    id: package
    attributes:
      label: Package (.zip)
      description: Attach the .fxdash.zip the plugin wrote (or a zip of the item's folder) by dragging it in or picking it with "selecting them" below. Nothing else.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Based on someone else's work?
      description: Leave empty if it's all yours. Otherwise the link to the original, and to where its author agreed to it being shared.
  - type: checkboxes
    id: rights
    attributes:
      label: Rights and rules
      options:
        - label: I made this, or its author gave me permission to share it under the licence in meta.json.
          required: true
        - label: It has no scripts (`js:`) and no logos or pictures I don't have the right to share.
          required: true
        - label: I read the [terms](https://github.com/fxunleashed/fx-unleashed-library/blob/main/TERMS.md).
          required: true
