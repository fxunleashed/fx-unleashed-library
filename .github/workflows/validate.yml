name: Validate library

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # every item: files, sizes, ids, sha256, dash format, no scripts, previews 800x480
      # (index.json is rebuilt after a merge by reindex.yml, so a submission doesn't have to touch it)
      - name: Check items
        run: python tools/build_index.py --validate
      # the submission tools on made-up packages, including every way they must refuse
      - name: Test the submission tools
        run: python -m unittest discover -s tools/tests -v
      # cars/: the per-car light data (published by the maintainers' extraction tools, not by pull requests)
      - name: Check car data
        run: python tools/check_cars.py
      # a pull request may only add or change items in their own folders (and index.json)
      - name: Only item folders changed
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          bad=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -Ev '^(dashes|savers)/[a-z0-9-]+/(dash\.json|meta\.json|preview\.png)$|^index\.json$' || true)
          if [ -n "$bad" ]; then echo "Only item folders and index.json may change in a submission:"; echo "$bad"; exit 1; fi
